server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    # Security headers. The CSP is deliberately strict: this application holds
    # standing administrative access to customer directories, so an injected
    # script would be worth a great deal to an attacker.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Graph synchronisation runs on the queue, so no HTTP request should
        # need anything like this long. It is a backstop, not a budget.
        fastcgi_read_timeout 120;
    }

    # Nothing outside public/ is served. Dotfiles are refused outright so a
    # stray .env can never be fetched over HTTP.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_page 404 /index.php;
}
